<VirtualHost *:443>
    ServerName speed.mn
    ServerAlias www.speed.mn
    DocumentRoot /var/www/awe

    <Directory /var/www/awe>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <FilesMatch "^\.env">
            Require all denied
        </FilesMatch>

        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME}\.php -f
        RewriteRule ^(.*)$ $1.php [L,QSA]
    </Directory>
</VirtualHost>
