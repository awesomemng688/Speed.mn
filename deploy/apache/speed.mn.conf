<VirtualHost *:80>
    ServerName speed.mn
    ServerAlias www.speed.mn
    DocumentRoot /var/www/speed.mn/public
    <Directory /var/www/speed.mn/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/speed.mn-error.log
    CustomLog ${APACHE_LOG_DIR}/speed.mn-access.log combined
</VirtualHost>
