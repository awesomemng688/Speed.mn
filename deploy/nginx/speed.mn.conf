server {
    listen 443 ssl;
    server_name speed.mn www.speed.mn;
    root /var/www/awe/current/public;
    index index.php;

    # TLS: certbot --nginx adds the ssl_certificate directives.

    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri.php /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
